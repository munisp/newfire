name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          # Use nullglob-safe find with proper quoting
          while IFS= read -r -d '' reqfile; do
            echo "installing $reqfile"
            pip install -r "$reqfile" || echo "WARN: failed to install $reqfile"
          done < <(find tenants -name requirements.txt -print0 2>/dev/null || true)

      - name: Lint
        run: |
          # Check all Python files, skip generated and third-party dirs
          ruff check . \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=__pycache__ \
            || echo "WARN: linting issues found but not blocking"

      - name: Test
        run: |
          # Only run tests if pytest can collect them
          python -m pytest -v --tb=short 2>&1 | tee test_results.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 5 ]; then
            echo "no tests collected yet, skipping"
            exit 0
          fi
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test_results.txt
